<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">KORGI logo with stylized corgi</title>
  <desc id="desc">Landscape transparent SVG: lounging corgi to the left, blocky synth-style text reading KORGI to the right.</desc>

  <!-- Themeable color tokens -->
  <defs>
    <style>
      :root {
        --ink: #111111;         /* main text + linework */
        --fur: #CC7A2B;         /* corgi orange */
        --furLight: #F5E9DA;    /* corgi cream/white */
        --nose: #111111;
        --eye: #111111;
      }
    </style>
  </defs>

  <!-- Layout guide (no fill = transparent background) -->
  <!-- Safe drawing area: left ~0-500 for corgi, right ~520-1180 for text -->

  <!-- ============= Corgi (stylized, lounging) ============= -->
  <g id="corgi" transform="translate(40,60)">
    <!-- Shadow for subtle grounding -->
    <ellipse cx="250" cy="270" rx="210" ry="22" fill="#000" opacity="0.12"/>

    <!-- Body/back (orange) -->
    <path fill="var(--fur)" stroke="var(--ink)" stroke-width="6" stroke-linejoin="round"
      d="M110,190
         C120,150 170,120 240,110
         C315,100 385,120 420,155
         C450,185 455,215 445,240
         C430,275 390,295 330,300
         L200,300
         C155,298 125,285 110,260
         C100,245 98,220 110,190 Z"/>

    <!-- Belly / chest cream patch -->
    <path fill="var(--furLight)" stroke="var(--ink)" stroke-width="6" stroke-linejoin="round"
      d="M150,220
         C170,195 205,180 250,178
         C300,176 330,190 352,210
         C340,245 305,265 255,268
         C215,270 180,255 160,240
         C155,235 152,228 150,220 Z"/>

    <!-- Hind leg tucked -->
    <path fill="var(--furLight)" stroke="var(--ink)" stroke-width="6" stroke-linejoin="round"
      d="M305,260
         C320,255 338,256 350,264
         C360,270 360,284 350,292
         C338,302 315,303 300,296
         C292,292 292,268 305,260 Z"/>

    <!-- Front legs tucked -->
    <path fill="var(--furLight)" stroke="var(--ink)" stroke-width="6" stroke-linejoin="round"
      d="M180,270
         C195,260 215,258 228,264
         C236,268 238,282 230,290
         C220,300 195,302 182,296
         C170,290 168,280 180,270 Z"/>

    <!-- Tail (stub) -->
    <path fill="var(--fur)" stroke="var(--ink)" stroke-width="6" stroke-linecap="round"
      d="M425,210
         C440,205 452,208 457,218
         C462,230 455,240 440,242
         C430,243 422,236 420,228
         C418,220 420,214 425,210 Z"/>

    <!-- Head (orange) -->
    <path fill="var(--fur)" stroke="var(--ink)" stroke-width="6" stroke-linejoin="round"
      d="M95,165
         C85,130 95,100 125,88
         C148,79 182,86 200,104
         C212,116 220,133 220,150
         C220,180 195,205 165,205
         C135,205 105,194 95,165 Z"/>

    <!-- Muzzle/face blaze (cream) -->
    <path fill="var(--furLight)" stroke="var(--ink)" stroke-width="6" stroke-linejoin="round"
      d="M150,150
         C148,138 155,128 168,123
         C182,118 195,121 202,129
         C208,136 208,150 200,162
         C192,175 178,185 165,186
         C156,187 151,180 150,173
         C149,167 150,157 150,150 Z"/>

    <!-- Ear left -->
    <path fill="var(--fur)" stroke="var(--ink)" stroke-width="6" stroke-linejoin="round"
      d="M130,96
         L120,70
         C117,62 118,54 124,50
         C133,44 150,48 154,58
         L165,86
         Z"/>

    <!-- Ear right (tilted) -->
    <path fill="var(--fur)" stroke="var(--ink)" stroke-width="6" stroke-linejoin="round"
      d="M175,96
         L185,70
         C189,60 200,56 208,60
         C215,64 216,76 210,84
         L195,104
         Z"/>

    <!-- Eye -->
    <circle cx="172" cy="148" r="6" fill="var(--eye)"/>

    <!-- Nose -->
    <ellipse cx="196" cy="165" rx="7" ry="5" fill="var(--nose)"/>

    <!-- Mouth hint -->
    <path d="M188,172 C191,176 197,176 200,172" fill="none" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>

    <!-- Collar (thin accent line) -->
    <path d="M132,170 C150,162 168,160 186,162" fill="none" stroke="var(--ink)" stroke-width="5" stroke-linecap="round" opacity="0.35"/>
  </g>

  <!-- ============= KORGI Wordmark (blocky synth-style) ============= -->
  <!-- Constructed as geometric paths to avoid using any trademarked font directly -->
  <g id="wordmark" transform="translate(520,60)" fill="var(--ink)">
    <!-- K -->
    <path d="M0,0 L60,0 L60,120 L120,60 L180,60 L115,117 L185,200 L125,200 L60,135 L60,200 L0,200 Z"/>
    <!-- O (rounded rectangle footprint) -->
    <path d="M220,0 L380,0 L380,200 L220,200 Z
             M270,45 L330,45 L330,155 L270,155 Z" fill-rule="evenodd"/>
    <!-- R -->
    <path d="M420,0 L560,0 C600,0 630,25 630,65 C630,95 612,118 580,127 L650,200 L580,200 L525,145 L480,145 L480,200 L420,200 Z
             M480,45 L555,45 C570,45 585,55 585,70 C585,85 572,95 555,95 L480,95 Z" fill-rule="nonzero"/>
    <!-- G -->
    <path d="M700,0 L860,0 L860,200 L735,200 C690,200 660,170 660,125 L660,75 C660,30 690,0 735,0 Z
             M720,45 C700,45 695,60 695,80 L695,120 C695,140 705,155 730,155 L805,155 L805,120 L760,120 L760,95 L860,95 L860,200 L735,200
             C690,200 660,170 660,125 L660,75 C660,30 690,0 735,0 L860,0 L860,45 Z" fill-rule="evenodd"/>
    <!-- I -->
    <rect x="900" y="0" width="60" height="200"/>
  </g>

  <!-- ============= Kerning / optical alignment tweaks ============= -->
  <!-- Slight global Y offset to center vertically inside the 400px height -->
  <g transform="translate(0,0)"></g>
</svg>

