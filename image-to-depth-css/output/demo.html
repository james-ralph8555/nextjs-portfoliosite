<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Parallax Preview</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="viewport" style="aspect-ratio: 2048 / 1524;">
    <div class="parallax" style="--perspective:800;">
<div class="layer" data-depth="0" data-speed="1.00" style="background-image: url('layer-1.png')"></div>
<div class="layer" data-depth="1" data-speed="0.60" style="background-image: url('layer-2.png')"></div>
<div class="layer" data-depth="2" data-speed="0.20" style="background-image: url('layer-3.png')"></div>
    </div>
  </main>
  <script src="./parallax.js"></script>
</body>
</html>
